version: 2

sources:
 - name: landing
   database: dbt_project_catalog
   schema: landing
   tables:
    - name: orders_incremental
    - name: orders
      columns:
        - name: id
          tests:
          - unique
          - not_null
        - name: product_id
          tests:
          - unique:
              config:
                severity: warn
        - name: quantity
          tests:
          - assert_non_negative
        - name: unit_price
          tests:
          - assert_non_negative
    - name: products
    - name: reviews
    - name: users